[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orphan-radar"
version = "0.1.0"
description = "Local-first engine for finding disconnected knowledge and generating reviewable graph-link suggestions."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Lowell Wong" }]
license = { text = "Apache-2.0" }
dependencies = [
  "networkx>=3.2",
  "scikit-learn>=1.4",
  "typer>=0.12",
  "pydantic>=2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  # Upper bounds on the linters: an unbounded `ruff>=0.5` turned CI red on an
  # unchanged tree when a new release widened ruff's default rule set. Raise
  # these deliberately, with the lint config below reviewed in the same change.
  "ruff>=0.5,<0.16",
  "mypy>=1.8,<2"
]

[project.scripts]
orphan-radar = "orphan_radar.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# State the rule set explicitly rather than inheriting ruff's defaults, which
# have widened across releases (a newer ruff added I, UP, SIM, FURB and RUF
# findings to this unchanged tree and broke CI). With `select` pinned here,
# lint results depend on this file rather than on the installed ruff version.
# These four are ruff's historical defaults: pyflakes plus the pycodestyle
# error subsets.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
# Required for the per-module `follow_imports` override below to apply to
# stub files. Without it mypy parses the .pyi regardless of the override.
follow_imports_for_stubs = true
# Aspiration: tighten toward `strict = true` module-by-module (see ROADMAP).

[[tool.mypy.overrides]]
# Skip third-party stubs rather than parsing them. numpy 2.5 ships stubs
# written with PEP 695 `type` statements, which mypy rejects while targeting
# python_version 3.11 -- a dependency-side change that failed the build on a
# tree with no numpy annotations of its own. `ignore_missing_imports` above
# already treats these packages as Any when absent, so skipping their stubs
# when present just makes the two cases agree.
#
# Scoped to these four packages on purpose: a global `follow_imports = "skip"`
# would also apply to first-party imports. Cross-module checking inside
# orphan_radar is unaffected -- verified against a two-module fixture where the
# override still reports incompatible argument types across a module boundary.
module = ["numpy.*", "scipy.*", "sklearn.*", "networkx.*"]
follow_imports = "skip"
